services:
  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: ./Front/.env.local
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: repusense
      POSTGRES_USER: repusense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Back/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Back/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repusense -d repusense"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: